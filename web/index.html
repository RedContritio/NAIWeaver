<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="NAIWeaver - NovelAI Image Generation Frontend">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NAIWeaver">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NAIWeaver</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="vendor/photoswipe/photoswipe.css">
  <!--
    DOM-backed text (the native prompt textarea and selectable text) cannot use
    fonts loaded into the Flutter engine by google_fonts; it needs the same
    families as web fonts. These are the font choices offered by the theme
    builder. Loaded without blocking first paint (media swap), so an
    unreachable fonts.googleapis.com only means the generic CSS fallback.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Fira+Code:wght@400;700&family=IBM+Plex+Mono:wght@400;700&family=Space+Mono:wght@400;700&family=Roboto+Mono:wght@400;700&family=Inter:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap">
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }
    input,
    textarea,
    [contenteditable="true"],
    flt-text-editing-host,
    flt-text-editing-host * {
      -webkit-touch-callout: default !important;
      -webkit-user-select: text !important;
      user-select: text !important;
    }
    .naiweaver-native-image {
      -webkit-touch-callout: default !important;
      -webkit-user-drag: auto !important;
      -webkit-user-select: auto !important;
      user-select: auto !important;
    }
    .naiweaver-photoswipe-host .pswp {
      position: absolute !important;
      inset: 0;
      z-index: 0;
    }
    .naiweaver-photoswipe-host .pswp__bg {
      background: #000;
    }
    .naiweaver-photoswipe-host .pswp__img {
      -webkit-touch-callout: default !important;
      -webkit-user-drag: auto !important;
      -webkit-user-select: auto !important;
      user-select: auto !important;
    }
    .naiweaver-photoswipe-host .pswp__button--close {
      display: none;
    }
    /* Colors come from the theme via custom properties set by
       BrowserNativeTextArea; the fallbacks are the system colors. */
    .naiweaver-native-textarea::selection {
      background: var(--naiweaver-selection-background, Highlight);
      color: var(--naiweaver-selection-foreground, HighlightText);
    }
    .naiweaver-native-textarea::-moz-selection {
      background: var(--naiweaver-selection-background, Highlight);
      color: var(--naiweaver-selection-foreground, HighlightText);
    }
    .naiweaver-native-textarea::placeholder {
      color: var(--naiweaver-placeholder-color, GrayText);
      opacity: 1;
    }
  </style>
</head>
<body>
  <script>
    document.addEventListener('contextmenu', (event) => {
      const target = event.target;
      if (target && target.closest && target.closest('.naiweaver-native-image, .pswp__img')) {
        event.stopImmediatePropagation();
      }
    }, true);

  </script>
  <script>
    (() => {
      const ready = import('./photoswipe_bridge.js').then(
        () => window.naiweaverPhotoSwipe,
      );
      window.naiweaverPhotoSwipe = {
        mount: (...args) => ready.then((api) => api.mount(...args)),
        update: (...args) => ready.then((api) => api.update(...args)),
        dispose: (...args) => ready.then((api) => api.dispose(...args)),
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
