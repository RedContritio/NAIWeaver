<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="NAIWeaver - NovelAI Image Generation Frontend">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NAIWeaver">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NAIWeaver</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="vendor/photoswipe/photoswipe.css">
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }
    input,
    textarea,
    [contenteditable="true"],
    flt-text-editing-host,
    flt-text-editing-host * {
      -webkit-touch-callout: default !important;
      -webkit-user-select: text !important;
      user-select: text !important;
    }
    .naiweaver-native-image {
      -webkit-touch-callout: default !important;
      -webkit-user-drag: auto !important;
      -webkit-user-select: auto !important;
      user-select: auto !important;
    }
    .naiweaver-photoswipe-host .pswp {
      position: absolute !important;
      inset: 0;
      z-index: 0;
    }
    .naiweaver-photoswipe-host .pswp__bg {
      background: #000;
    }
    .naiweaver-photoswipe-host .pswp__img {
      -webkit-touch-callout: default !important;
      -webkit-user-drag: auto !important;
      -webkit-user-select: auto !important;
      user-select: auto !important;
    }
    .naiweaver-photoswipe-host .pswp__button--close {
      display: none;
    }
    .naiweaver-native-textarea::selection {
      background: var(--naiweaver-selection-background, rgba(86, 156, 214, 0.72));
      color: var(--naiweaver-selection-foreground, #ffffff);
    }
    .naiweaver-native-textarea::-moz-selection {
      background: var(--naiweaver-selection-background, rgba(86, 156, 214, 0.72));
      color: var(--naiweaver-selection-foreground, #ffffff);
    }
  </style>
</head>
<body>
  <script>
    document.addEventListener('contextmenu', (event) => {
      const target = event.target;
      if (target && target.closest && target.closest('.naiweaver-native-image, .pswp__img')) {
        event.stopImmediatePropagation();
      }
    }, true);

  </script>
  <script>
    (() => {
      const ready = import('./photoswipe_bridge.js').then(
        () => window.naiweaverPhotoSwipe,
      );
      window.naiweaverPhotoSwipe = {
        mount: (...args) => ready.then((api) => api.mount(...args)),
        update: (...args) => ready.then((api) => api.update(...args)),
        dispose: (...args) => ready.then((api) => api.dispose(...args)),
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
